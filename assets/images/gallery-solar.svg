<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="solarTitle solarDesc">
  <title id="solarTitle">Solar panel installation workshop</title>
  <desc id="solarDesc">Illustration of students learning about solar panels on a school rooftop</desc>
  <rect width="600" height="400" fill="#87CEEB"/>
  <rect x="0" y="280" width="600" height="120" fill="#E9ECEF"/>
  <polygon points="50,280 300,120 550,280" fill="#ADB5BD"/>
  <rect x="120" y="200" width="80" height="50" fill="#1C7ED6" opacity="0.8" transform="rotate(-30 160 225)"/>
  <rect x="220" y="170" width="80" height="50" fill="#1C7ED6" opacity="0.85" transform="rotate(-30 260 195)"/>
  <rect x="320" y="145" width="80" height="50" fill="#1C7ED6" opacity="0.9" transform="rotate(-30 360 170)"/>
