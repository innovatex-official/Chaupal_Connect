<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Villagers gathered under the banyan tree</title>
  <desc id="heroDesc">Warm illustration of villagers meeting under a large banyan tree in a rural village</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2D7A8"/>
      <stop offset="55%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#D4B06A"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8FA05A"/>
      <stop offset="100%" stop-color="#5F7336"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="78%" cy="18%" r="28%">
      <stop offset="0%" stop-color="#F5E6A8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F5E6A8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="640" fill="url(#sky)"/>
  <circle cx="640" cy="110" r="220" fill="url(#sunGlow)"/>
  <circle cx="650" cy="120" r="48" fill="#E8C547"/>

  <!-- Distant hills -->
  <ellipse cx="160" cy="430" rx="220" ry="70" fill="#9AAD6A" opacity="0.45"/>
  <ellipse cx="620" cy="440" rx="240" ry="80" fill="#7E9250" opacity="0.4"/>

  <!-- Ground -->
  <ellipse cx="400" cy="560" rx="420" ry="110" fill="url(#ground)"/>
  <ellipse cx="400" cy="580" rx="380" ry="70" fill="#4E602C" opacity="0.35"/>

  <!-- Huts -->
  <g>
    <polygon points="70,470 120,390 170,470" fill="#C4704A"/>
    <rect x="90" y="470" width="60" height="52" fill="#A85A38"/>
    <rect x="112" y="488" width="18" height="34" fill="#5C4030"/>
    <polygon points="630,480 680,395 730,480" fill="#C4704A"/>
    <rect x="650" y="480" width="60" height="48" fill="#A85A38"/>
    <rect x="672" y="496" width="18" height="32" fill="#5C4030"/>
  </g>

  <!-- Banyan trunk + canopy -->
  <rect x="370" y="250" width="60" height="250" rx="10" fill="#5C4A32"/>
  <rect x="352" y="300" width="20" height="180" rx="8" fill="#4A3A28"/>
  <rect x="428" y="310" width="18" height="160" rx="8" fill="#4A3A28"/>

  <ellipse cx="400" cy="230" rx="220" ry="120" fill="#6B7F3C"/>
  <ellipse cx="280" cy="250" rx="110" ry="80" fill="#556B2F"/>
  <ellipse cx="520" cy="245" rx="120" ry="85" fill="#556B2F"/>
  <ellipse cx="400" cy="175" rx="150" ry="90" fill="#7A8F4E"/>
  <ellipse cx="340" cy="210" rx="90" ry="60" fill="#6B7F3C" opacity="0.85"/>
  <ellipse cx="470" cy="205" rx="95" ry="62" fill="#6B7F3C" opacity="0.85"/>

  <!-- Aerial roots -->
  <path d="M300 280 Q285 360 310 470" stroke="#5C4A32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M500 275 Q520 355 490 465" stroke="#5C4A32" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M250 300 Q235 370 255 450" stroke="#4A3A28" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M545 295 Q565 365 548 450" stroke="#4A3A28" stroke-width="3.5" fill="none" stroke-linecap="round"/>

  <!-- People gathering -->
  <g fill="#3D2A1C">
    <circle cx="250" cy="500" r="14"/><rect x="243" y="514" width="14" height="30" rx="5"/>
    <circle cx="300" cy="508" r="13"/><rect x="293" y="520" width="14" height="28" rx="5"/>
    <circle cx="350" cy="504" r="14"/><rect x="343" y="518" width="14" height="30" rx="5"/>
    <circle cx="450" cy="502" r="14"/><rect x="443" y="516" width="14" height="30" rx="5"/>
    <circle cx="505" cy="508" r="13"/><rect x="498" y="520" width="14" height="28" rx="5"/>
    <circle cx="555" cy="500" r="14"/><rect x="548" y="514" width="14" height="30" rx="5"/>
  </g>

  <!-- Small accents -->
  <circle cx="180" cy="430" r="6" fill="#C9A227" opacity="0.7"/>
  <circle cx="620" cy="420" r="5" fill="#C9A227" opacity="0.65"/>
</svg>
